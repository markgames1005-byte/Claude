<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f1a">
<title>66 Days to Live Your Life</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="66 Days">
<meta name="description" content="Convierte tu vida en un videojuego: reto de 66 días, hábitos con experiencia, rangos de Madera a Dios, rivales y gráfico de habilidades.">
<style>
  :root{
    --bg:#0d0f1a;
    --bg-2:#141728;
    --card:#1a1e33;
    --card-2:#222742;
    --border:#2e3456;
    --text:#eef0ff;
    --text-2:#a8aed6;
    --text-3:#6f76a3;
    --accent:#7c5cff;
    --accent-2:#22d3ee;
    --good:#34d399;
    --bad:#f87171;
    --gold:#fbbf24;
    --rank:#a0703c;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(700px 400px at 110% 10%, rgba(34,211,238,.12), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    padding-bottom:90px;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,select{font:inherit;color:var(--text)}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  h1,h2,h3{line-height:1.2}
  h2{font-size:1.1rem;margin-bottom:12px;letter-spacing:.02em}
  .muted{color:var(--text-2)}
  .small{font-size:.82rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:12px}
  .between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .btn{background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;letter-spacing:.02em;transition:transform .1s,filter .15s}
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--card-2);color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:#7f1d1d}
  .btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px;white-space:nowrap;flex:none}
  .rec-h > span:last-child{white-space:nowrap}
  .two .btn.sm{white-space:normal;padding:9px 8px}
  .btn.block{width:100%}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);font-size:.8rem;font-weight:600}

  /* Header */
  header.top{position:sticky;top:0;z-index:20;background:rgba(13,15,26,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  header.top .wrap{padding:10px 16px}
  .hdr-avatar{width:48px;height:48px;flex:none}
  .rank-badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;padding:3px 10px;border-radius:999px;color:#111;background:var(--rank);box-shadow:0 0 14px color-mix(in srgb,var(--rank) 60%,transparent)}
  .xpbar{height:8px;background:var(--card-2);border-radius:99px;overflow:hidden;margin-top:6px}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .5s}

  /* Nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(20,23,40,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .wrap{display:flex;padding:6px 8px}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;font-size:.72rem;color:var(--text-3);font-weight:600}
  nav.tabs button span{font-size:1.35rem;line-height:1}
  nav.tabs button.on{color:var(--text);background:var(--card-2)}

  /* Habits */
  .habit{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card-2);border:1px solid var(--border);margin-bottom:8px;transition:background .2s,border-color .2s}
  .habit .ic{font-size:1.4rem;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--bg-2);flex:none}
  .habit .nm{font-weight:600;overflow-wrap:anywhere}
  .habit .xp{font-weight:800;font-size:.85rem;white-space:nowrap}
  .habit.good .xp{color:var(--good)}
  .habit.bad .xp{color:var(--bad)}
  .check{width:34px;height:34px;border-radius:10px;border:2px solid var(--border);display:grid;place-items:center;flex:none;font-size:1.1rem;transition:all .15s}
  .habit.good.done{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.5)}
  .habit.good.done .check{background:var(--good);border-color:var(--good);color:#06281b}
  .habit.bad.done{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.5)}
  .habit.bad.done .check{background:var(--bad);border-color:var(--bad);color:#3b0909}
  .habit .del{color:var(--text-3);font-size:1.1rem;padding:4px 8px;display:none}
  .editing .habit .del{display:block}
  .editing .habit .check{display:none}

  /* Day grid */
  .grid66{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
  .grid66 div{aspect-ratio:1;border-radius:6px;background:var(--card-2);display:grid;place-items:center;font-size:.62rem;color:var(--text-3);position:relative}
  .grid66 .partial{background:rgba(124,92,255,.35);color:var(--text)}
  .grid66 .done{background:rgba(52,211,153,.55);color:#04140d}
  .grid66 .perfect{background:var(--gold);color:#2a1b00;font-weight:800}
  .grid66 .miss{background:rgba(248,113,113,.18)}
  .grid66 .today{outline:2px solid var(--accent-2);outline-offset:1px;color:var(--text)}
  .grid66 .badmark::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--bad)}

  /* Coach */
  .coach{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(34,211,238,.1));border-color:rgba(124,92,255,.45)}
  .coach .bot{font-size:1.8rem;flex:none}

  /* Stats */
  .radar-box{position:relative;width:100%;max-width:420px;margin:0 auto}
  canvas{display:block;width:100%;height:auto}
  .skill-row{display:grid;grid-template-columns:28px 1fr 44px;align-items:center;gap:10px;margin-bottom:9px}
  .skill-row .bar{height:9px;border-radius:99px;background:var(--card-2);overflow:hidden}
  .skill-row .bar i{display:block;height:100%;border-radius:99px}
  .rec{border-left:3px solid var(--accent);padding:10px 12px;background:var(--card-2);border-radius:0 12px 12px 0;margin-bottom:10px}
  .rec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--border);font-size:.9rem}
  .rec-h:first-of-type{border-top:none}

  /* Ranking */
  .ladder{display:flex;flex-direction:column-reverse;gap:6px}
  .ladder .lv{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--border);opacity:.55}
  .ladder .lv.got{opacity:1}
  .ladder .lv.cur{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px color-mix(in srgb,var(--c) 40%,transparent);opacity:1}
  .ladder .em{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;background:var(--c);flex:none}
  .lb{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;margin-bottom:6px;background:var(--card-2)}
  .lb.me{background:linear-gradient(90deg,rgba(124,92,255,.35),rgba(34,211,238,.15));border:1px solid var(--accent)}
  .lb .pos{width:26px;text-align:center;font-weight:800;color:var(--text-2)}
  .lb .dot{width:12px;height:12px;border-radius:50%;flex:none}

  /* Avatar editor */
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
  .opt{padding:7px 12px;border-radius:10px;background:var(--card-2);border:2px solid var(--border);font-size:.85rem;font-weight:600}
  .opt.on{border-color:var(--accent);background:rgba(124,92,255,.2)}
  .opt.locked{opacity:.4;cursor:not-allowed}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--border)}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .avatar-big{width:180px;height:220px;margin:0 auto;display:block}

  /* Onboarding */
  .ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-bottom:0}
  .ob h1{font-size:1.8rem;margin-bottom:6px}
  .ob .logo{font-size:.8rem;letter-spacing:.3em;color:var(--accent-2);font-weight:800;margin-bottom:10px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.85rem;color:var(--text-2);margin-bottom:6px;font-weight:600}
  .field input[type=text],.field input[type=number],.field select{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg-2);border:1px solid var(--border);outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .range{display:flex;align-items:center;gap:12px}
  .range input{flex:1;accent-color:var(--accent)}
  .range b{min-width:42px;text-align:right}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border-radius:999px;background:var(--bg-2);border:2px solid var(--border);font-weight:600;font-size:.9rem}
  .chip.on{border-color:var(--accent);background:rgba(124,92,255,.25)}
  .steps{display:flex;gap:6px;margin-bottom:22px}
  .steps i{flex:1;height:5px;border-radius:9px;background:var(--card-2)}
  .steps i.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}

  /* Modal & toast */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(5,6,12,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:16px}
  .modal.show{display:flex}
  .modal .sheet{width:100%;max-width:520px;background:var(--bg-2);border:1px solid var(--border);border-radius:20px;padding:20px;max-height:90vh;overflow:auto}
  @media(min-width:600px){.modal{align-items:center}}
  .toasts{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:400px}
  .toast{padding:10px 16px;border-radius:12px;font-weight:800;background:var(--card);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease-out}
  .toast.good{color:var(--good)} .toast.bad{color:var(--bad)} .toast.gold{color:var(--gold)}
  @keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
  .rankup{text-align:center}
  .rankup .big{font-size:4rem;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
  .ring{width:64px;height:64px;flex:none}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat3 div{background:var(--card-2);border-radius:12px;padding:10px;text-align:center}
  .stat3 b{display:block;font-size:1.2rem}
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* =========================================================
   66 DAYS TO LIVE YOUR LIFE — tu vida como un videojuego
   Todo se guarda en el navegador (localStorage).
   ========================================================= */

const RANKS = [
  {n:'Madera',       min:0,     c:'#a0703c', i:'🪵'},
  {n:'Bronce',       min:500,   c:'#cd7f32', i:'🥉'},
  {n:'Plata',        min:1200,  c:'#c3cad6', i:'🥈'},
  {n:'Oro',          min:2200,  c:'#fbbf24', i:'🥇'},
  {n:'Platino',      min:3500,  c:'#5eead4', i:'💠'},
  {n:'Rubí',         min:5000,  c:'#f43f72', i:'♦️'},
  {n:'Campeón',      min:7000,  c:'#fb923c', i:'🏆'},
  {n:'Gran Campeón', min:9500,  c:'#c084fc', i:'👑'},
  {n:'Dios',         min:13500, c:'#fff3b0', i:'🌟'},
];

const SKILLS = {
  fuerza:     {n:'Fuerza',      e:'💪', c:'#f87171'},
  resistencia:{n:'Resistencia', e:'🏃', c:'#fb923c'},
  nutricion:  {n:'Nutrición',   e:'🥗', c:'#34d399'},
  sueno:      {n:'Sueño',       e:'😴', c:'#818cf8'},
  mente:      {n:'Mente',       e:'🧘', c:'#c084fc'},
  intelecto:  {n:'Intelecto',   e:'📚', c:'#22d3ee'},
  social:     {n:'Social',      e:'🤝', c:'#f472b6'},
  finanzas:   {n:'Finanzas',    e:'💰', c:'#fbbf24'},
};
const SK = Object.keys(SKILLS);

/* Recomendaciones por habilidad: consejos + hábitos buenos y malos sugeridos */
const RECS = {
  fuerza:{
    tips:['Entrena fuerza 3-4 días por semana con progresión (más peso o repeticiones cada semana).','Prioriza básicos: sentadilla, peso muerto, press y dominadas.','Come suficiente proteína (aprox. 1,6-2 g por kg de peso).'],
    good:[['Entreno de fuerza 45 min',30,'🏋️'],['50 flexiones repartidas en el día',15,'💪'],['Escaleras en vez de ascensor',8,'🪜']],
    bad:[['Saltarme el entreno planificado',20,'🛋️']]},
  resistencia:{
    tips:['Empieza con 20-30 min de cardio suave (puedes hablar mientras lo haces).','Sube el volumen un 10% por semana como máximo.','Caminar cuenta: apunta a 8.000-10.000 pasos diarios.'],
    good:[['Correr / bici / nadar 30 min',25,'🏃'],['10.000 pasos',20,'👟'],['Comba o HIIT 10 min',12,'⏱️']],
    bad:[['Más de 8 h sentado sin moverme',10,'🪑']]},
  nutricion:{
    tips:['Llena medio plato con verdura en cada comida principal.','Bebe agua antes de cada comida; 2 L al día es un buen objetivo.','Planifica y cocina tus comidas: reduce ultraprocesados.'],
    good:[['3 raciones de fruta/verdura',15,'🥦'],['Beber 2 L de agua',10,'💧'],['Cocinar mi comida en casa',15,'🍳'],['Proteína en cada comida',10,'🥚']],
    bad:[['Comida basura / ultraprocesados',25,'🍔'],['Refrescos azucarados',15,'🥤'],['Picar entre horas por ansiedad',10,'🍫']]},
  sueno:{
    tips:['Duerme 7-9 h y acuéstate siempre a la misma hora.','Nada de pantallas 1 h antes de dormir; habitación oscura y fresca.','Evita la cafeína a partir de las 15:00.'],
    good:[['Dormir 7-9 horas',20,'😴'],['Sin pantallas 1 h antes de dormir',15,'📵'],['Acostarme antes de las 23:30',10,'🌙']],
    bad:[['Trasnochar sin motivo',20,'🦉'],['Café después de las 17:00',8,'☕']]},
  mente:{
    tips:['Medita 10 minutos al día (respiración, apps o en silencio).','Escribe 3 cosas por las que estás agradecido cada noche.','Haz primero la tarea más difícil del día.'],
    good:[['Meditar 10 min',15,'🧘'],['Escribir en mi diario',10,'📓'],['Ducha fría',15,'🚿'],['Hacer la tarea difícil primero',15,'🎯']],
    bad:[['Procrastinar algo importante',15,'⏳'],['Pensamientos negativos sin frenar',8,'🌧️']]},
  intelecto:{
    tips:['Lee 20 páginas al día: son más de 7.000 al año.','Aprende algo concreto: un idioma, un curso, una habilidad.','Sustituye scroll por podcasts o audiolibros.'],
    good:[['Leer 20 páginas',20,'📖'],['Estudiar / curso 30 min',20,'🧠'],['Practicar un idioma 15 min',12,'🗣️']],
    bad:[['Más de 3 h en redes sociales',25,'📱'],['Maratón de series sin control',15,'📺']]},
  social:{
    tips:['Habla cada día con alguien importante para ti (no solo por chat).','Haz un plan semanal con amigos o familia.','Ayuda a alguien o haz un cumplido sincero.'],
    good:[['Llamar o ver a un amigo/familiar',12,'📞'],['Ayudar o hacer un cumplido',10,'🫶'],['Plan social sin móvil',15,'🎉']],
    bad:[['Discutir / tratar mal a alguien',15,'💢'],['Aislarme todo el día',10,'🚪']]},
  finanzas:{
    tips:['Apunta todos tus gastos durante el reto.','Ahorra automáticamente un % de lo que ganas al cobrar.','Regla de las 48 h: espera 2 días antes de cualquier compra no esencial.'],
    good:[['Registrar mis gastos del día',10,'🧾'],['Día sin gastos innecesarios',15,'🔒'],['Aprender sobre finanzas 15 min',10,'📈']],
    bad:[['Compra impulsiva',20,'🛍️'],['Apuestas',30,'🎰']]},
};

const GOALS = [
  ['fuerza','💪 Ganar músculo'],['resistencia','🏃 Mejorar cardio'],['nutricion','🥗 Perder grasa / comer mejor'],
  ['sueno','😴 Dormir mejor'],['mente','🧘 Disciplina y mente'],['intelecto','📚 Aprender / leer más'],
  ['social','🤝 Vida social'],['finanzas','💰 Ahorrar dinero'],
];

const RIVAL_NAMES = ['Lucía_Fit','Dani_Beast','Sara.Runner','ElTitán','Marta_Zen','Hugo_Grind','Nora_Lift','Iker66','Valeria_Pro','Pablo_Disciplina','Alex_Monk'];

const AV = {
  skins:['#f5d0b5','#e8b48f','#c98c62','#a0673f','#6e4426','#45291a'],
  hairColors:['#1b1b1b','#5a3a22','#a0642d','#e0b44c','#d9d9d9','#e2463c','#5b6cff','#29c48a'],
  shirts:['#7c5cff','#22d3ee','#ef4444','#22c55e','#f59e0b','#111827','#f9fafb','#ec4899'],
  hairs:[['corto','Corto'],['largo','Largo'],['pinchos','Pinchos'],['mono','Moño'],['rapado','Rapado']],
  accs:[['none','Nada',0],['gafas','Gafas',0],['cinta','Cinta',1],['gorra','Gorra',2],['auris','Cascos',4],['halo','Halo',7],['corona','Corona',8]],
};

/* ---------------- Estado ---------------- */
const KEY='lifereset66.v1';
let S = load();
let tab = 'hoy';
let editing = false;
let ob = {step:0, d:{name:'',age:'',sex:'h',weight:'',height:'',goals:[],sleep:7,gym:0,cardio:0,veg:2,fast:2,water:1.5,stress:3,phone:4,read:10,social:3,money:3}};

function load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null }catch(e){ return null } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }

const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const dayIndex=()=>Math.floor((parseKey(today())-parseKey(S.start))/864e5)+1;
const clamp=(v,a=5,b=100)=>Math.max(a,Math.min(b,Math.round(v)));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>Math.round(n).toLocaleString('es-ES');

function rankOf(xp){ let i=0; RANKS.forEach((r,k)=>{ if(xp>=r.min) i=k }); return i }
function rankInfo(xp){
  const i=rankOf(xp), r=RANKS[i], next=RANKS[i+1];
  if(!next) return {i,r,div:'',pct:100,toNext:0,next:null};
  const span=next.min-r.min, into=xp-r.min, third=span/3;
  const div=['III','II','I'][Math.min(2,Math.floor(into/third))];
  return {i,r,div,pct:into/span*100,toNext:next.min-xp,next};
}
function skillVal(k){ return clamp(S.base[k]+(S.delta[k]||0)) }
function getDay(k=today()){ return S.days[k] || (S.days[k]={done:{},bonus:0}) }

/* Día cumplido = al menos el 60 % de hábitos buenos */
function dayStatus(k){
  const d=S.days[k]; const goods=S.habits.filter(h=>h.type==='good');
  if(!d||!goods.length) return {cls:'',bad:false};
  const g=goods.filter(h=>d.done[h.id]!==undefined).length;
  const bad=S.habits.some(h=>h.type==='bad'&&d.done[h.id]!==undefined);
  const r=g/goods.length;
  let cls = r===0?'':r>=1&&!bad?'perfect':r>=.6?'done':'partial';
  return {cls,bad,r};
}
function streak(){
  let n=0, d=parseKey(today());
  const st=dayStatus(dkey(d)).cls;
  if(st==='done'||st==='perfect') n++;
  d.setDate(d.getDate()-1);
  while(d>=parseKey(S.start)){
    const c=dayStatus(dkey(d)).cls;
    if(c==='done'||c==='perfect'){n++; d.setDate(d.getDate()-1)} else break;
  }
  return n;
}

/* ---------------- Rivales simulados ---------------- */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296 } }
function rivals(){
  const D=dayIndex(), hourFrac=new Date().getHours()/24;
  return RIVAL_NAMES.map((name,i)=>{
    const r=rng(S.seed+i*977);
    const rate=60+r()*200, flake=r()*.35;
    let xp=0;
    for(let d=0; d<D; d++){
      const x=r();
      let gain = x<flake ? -rate*.4*r() : rate*(.5+r()*1.0);
      if(d===D-1) gain*=hourFrac;
      xp=Math.max(0,xp+gain);
    }
    return {name,xp:Math.round(xp),color:RANKS[rankOf(xp)].c};
  });
}

/* ---------------- Coach ---------------- */
function coach(){
  const h=new Date().getHours(), st=dayStatus(today()), goods=S.habits.filter(x=>x.type==='good');
  const d=getDay(); const done=goods.filter(x=>d.done[x.id]!==undefined).length;
  const weakest=[...SK].sort((a,b)=>skillVal(a)-skillVal(b))[0];
  const ri=rankInfo(S.xp), sk=streak(), name=esc(S.profile.name||'jugador');
  const lines=[];
  if(st.bad) lines.push(`Has marcado un hábito malo hoy. No pasa nada, ${name}: un mal momento no define tu partida. Compénsalo con un hábito bueno ahora mismo.`);
  else if(done===0 && h<12) lines.push(`Buenos días, ${name}. Empieza con el hábito más fácil para coger inercia: la primera victoria del día es la más importante.`);
  else if(done===0) lines.push(`Aún no has sumado XP hoy. Elige UN hábito y hazlo en los próximos 10 minutos.`);
  else if(st.cls==='perfect') lines.push(`¡Día perfecto! 🔥 Has ganado el bonus. Así es como se sube a ${ri.next?ri.next.n:'la cima'}.`);
  else lines.push(`Llevas ${done}/${goods.length} hábitos. ${goods.length-done} más y cierras el día como un pro.`);
  if(sk>=3) lines.push(`Racha de ${sk} días: tu multiplicador de XP es x${(1+Math.min(sk,10)*.05).toFixed(2)}.`);
  if(ri.next) lines.push(`Te faltan ${fmt(ri.toNext)} XP para ${ri.next.i} ${ri.next.n}.`);
  lines.push(`Tu punto débil es ${SKILLS[weakest].e} ${SKILLS[weakest].n} (${skillVal(weakest)}/100). Consejo: ${RECS[weakest].tips[dayIndex()%RECS[weakest].tips.length]}`);
  return lines;
}

/* ---------------- XP ---------------- */
function addXp(n){
  const before=rankOf(S.xp);
  S.xp=Math.max(0,S.xp+n);
  const after=rankOf(S.xp);
  if(after>before){ S.best=Math.max(S.best||0,after); setTimeout(()=>rankModal(after,true),350) }
  else if(after<before){ setTimeout(()=>rankModal(after,false),350) }
}
function toggleHabit(id){
  const h=S.habits.find(x=>x.id===id); if(!h) return;
  const d=getDay();
  if(d.done[id]!==undefined){
    addXp(-d.done[id]);
    S.delta[h.skill]=(S.delta[h.skill]||0) + (h.type==='good'?-1:1.5);
    delete d.done[id];
    toast('Deshecho ↩','');
  }else{
    let amt;
    if(h.type==='good'){ amt=Math.round(h.xp*(1+Math.min(streak(),10)*.05)); S.delta[h.skill]=(S.delta[h.skill]||0)+1 }
    else { amt=-h.xp; S.delta[h.skill]=(S.delta[h.skill]||0)-1.5 }
    d.done[id]=amt; addXp(amt);
    toast(`${amt>0?'+':''}${amt} XP · ${SKILLS[h.skill].e} ${SKILLS[h.skill].n} ${amt>0?'▲':'▼'}`, amt>0?'good':'bad');
  }
  // bonus de día perfecto
  const st=dayStatus(today());
  if(st.cls==='perfect' && !d.bonus){ d.bonus=50; addXp(50); setTimeout(()=>toast('🔥 ¡DÍA PERFECTO! +50 XP','gold'),250) }
  else if(st.cls!=='perfect' && d.bonus){ addXp(-d.bonus); d.bonus=0 }
  save(); render();
}

function toast(msg,cls){
  if(!msg) return;
  const box=document.getElementById('toasts');
  const t=document.createElement('div'); t.className='toast '+cls; t.textContent=msg;
  box.appendChild(t);
  while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>t.remove(),2200);
}

/* ---------------- Radar (gráfico de telaraña) ---------------- */
function drawRadar(canvas, now, initial){
  const dpr=window.devicePixelRatio||1, W=canvas.clientWidth||360, H=W;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const cx=W/2, cy=H/2, R=W*.31, n=SK.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(a)*R*v/100, cy+Math.sin(a)*R*v/100]};
  ctx.clearRect(0,0,W,H);
  for(let l=1;l<=5;l++){
    ctx.beginPath(); SK.forEach((k,i)=>{const [x,y]=pt(i,l*20); i?ctx.lineTo(x,y):ctx.moveTo(x,y)}); ctx.closePath();
    ctx.strokeStyle='rgba(168,174,214,.18)'; ctx.lineWidth=1; ctx.stroke();
  }
  SK.forEach((k,i)=>{const [x,y]=pt(i,100); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.strokeStyle='rgba(168,174,214,.14)'; ctx.stroke()});
  const poly=(vals,fill,stroke,dash)=>{
    ctx.beginPath(); SK.forEach((k,i)=>{const [x,y]=pt(i,vals[k]); i?ctx.lineTo(x,y):ctx.moveTo(x,y)}); ctx.closePath();
    if(fill){ctx.fillStyle=fill; ctx.fill()}
    ctx.setLineDash(dash||[]); ctx.strokeStyle=stroke; ctx.lineWidth=2.2; ctx.stroke(); ctx.setLineDash([]);
  };
  if(initial) poly(initial,null,'rgba(168,174,214,.55)',[5,5]);
  poly(now,'rgba(124,92,255,.32)','#8b6cff');
  SK.forEach((k,i)=>{const [x,y]=pt(i,now[k]); ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fillStyle=SKILLS[k].c; ctx.fill()});
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const fs=Math.max(11,W*.034);
  SK.forEach((k,i)=>{
    const [x,y]=pt(i,128);
    ctx.font=`${fs*1.3}px system-ui`; ctx.fillText(SKILLS[k].e,x,y-fs*1.1);
    ctx.font=`600 ${fs}px system-ui`; ctx.fillStyle='#a8aed6'; ctx.fillText(SKILLS[k].n,x,y+fs*.2);
    ctx.font=`800 ${fs}px system-ui`; ctx.fillStyle='#eef0ff'; ctx.fillText(now[k],x,y+fs*1.3);
    ctx.fillStyle='#000';
  });
}

/* =========================================================
   ONBOARDING
   ========================================================= */
function computeBase(d){
  const bmi = d.weight&&d.height ? d.weight/Math.pow(d.height/100,2) : 22;
  const bmiPen = bmi<18.5||bmi>=25 ? (bmi>=30?14:7) : 0;
  const sleepMap={4:22,5:35,6:55,7:78,8:92,9:86,10:70};
  return {
    fuerza: clamp(14+d.gym*13),
    resistencia: clamp(14+d.cardio*13-(bmi>=30?10:0)),
    nutricion: clamp(32+d.veg*10-d.fast*6+d.water*6-bmiPen),
    sueno: clamp(sleepMap[d.sleep]??50),
    mente: clamp(100-(d.stress-1)*18-Math.max(0,d.phone-3)*4),
    intelecto: clamp(18+d.read*1.1-Math.max(0,d.phone-4)*3),
    social: clamp(d.social*19),
    finanzas: clamp(d.money*19),
    bmi
  };
}

function obGoal(k){ const g=ob.d.goals; g.includes(k)?g.splice(g.indexOf(k),1):g.push(k); renderOnboarding() }
function obNext(){
  if(ob.step===1 && !ob.d.name.trim()){ toast('Escribe tu nombre de jugador','bad'); return }
  ob.step++; renderOnboarding(); window.scrollTo(0,0);
}
function obFinish(){
  const d=ob.d, b=computeBase(d); delete b.bmi;
  const weak=[...SK].sort((x,y)=>b[x]-b[y]).slice(0,3);
  const focus=[...new Set([...d.goals,...weak])];
  const habits=[];
  focus.forEach((k,idx)=>{
    RECS[k].good.slice(0, idx<3?2:1).forEach(([n,xp,ic])=>habits.push({id:uid(),name:n,type:'good',xp,skill:k,icon:ic}));
  });
  // malos hábitos típicos según respuestas
  const bads=[];
  if(d.fast>=2) bads.push(RECS.nutricion.bad[0]);
  if(d.phone>=3) bads.push(RECS.intelecto.bad[0]);
  if(d.sleep<=6) bads.push(RECS.sueno.bad[0]);
  if(d.money<=2) bads.push(RECS.finanzas.bad[0]);
  if(bads.length<2) bads.push(RECS.mente.bad[0]);
  const badSkill={'Comida basura / ultraprocesados':'nutricion','Más de 3 h en redes sociales':'intelecto','Trasnochar sin motivo':'sueno','Compra impulsiva':'finanzas','Procrastinar algo importante':'mente'};
  bads.forEach(([n,xp,ic])=>habits.push({id:uid(),name:n,type:'bad',xp,skill:badSkill[n],icon:ic}));
  S={
    v:1, profile:{name:d.name.trim(),age:d.age,sex:d.sex,weight:d.weight,height:d.height,goals:d.goals,answers:{...d}},
    base:b, delta:{}, start:today(), xp:0, best:0, habits, days:{},
    avatar:{skin:AV.skins[1],hair:d.sex==='m'?'largo':'corto',hairColor:AV.hairColors[1],shirt:AV.shirts[0],acc:'none'},
    seed:Math.floor(Math.random()*1e9)
  };
  save(); tab='perfil'; render();
  setTimeout(()=>toast('Personaliza tu personaje 🎨','gold'),300);
}

  return `<nav class="tabs"><div class="wrap">${t.map(([k,e,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${e}</span>${l}</button>`).join('')}</div></nav>`;
}
function go(t){ tab=t; editing=false; render(); window.scrollTo(0,0) }

function habitCard(h,d){
  const on=d.done[h.id]!==undefined;
  const xp = on ? d.done[h.id] : (h.type==='good'?h.xp:-h.xp);
  return `<div class="habit ${h.type} ${on?'done':''}">
    <div class="ic">${esc(h.icon||SKILLS[h.skill].e)}</div>
    <div class="grow"><div class="nm">${esc(h.name)}</div><div class="small muted">${SKILLS[h.skill].e} ${SKILLS[h.skill].n}</div></div>
    <div class="xp">${xp>0?'+':''}${xp} XP</div>
    <button class="check" onclick="toggleHabit('${h.id}')" aria-label="${on?'Desmarcar':'Marcar'} ${esc(h.name)}">${on?(h.type==='good'?'✓':'✗'):''}</button>
    <button class="del" onclick="delHabit('${h.id}')" aria-label="Borrar">🗑️</button>
  </div>`;
}

function viewHoy(){
  const D=dayIndex(), d=getDay(), goods=S.habits.filter(h=>h.type==='good'), bads=S.habits.filter(h=>h.type==='bad');
  const gDone=goods.filter(h=>d.done[h.id]!==undefined).length;
  const todayXp=Object.values(d.done).reduce((a,b)=>a+b,0)+(d.bonus||0);
  const sk=streak();
  let grid='';
  for(let i=1;i<=66;i++){
    const dt=parseKey(S.start); dt.setDate(dt.getDate()+i-1); const k=dkey(dt);
    const st= i<=D ? dayStatus(k) : {cls:'',bad:false};
    const cls=[st.cls|| (i<D?'miss':''), i===D?'today':'', st.bad?'badmark':''].join(' ');
    grid+=`<div class="${cls}" title="Día ${i}">${i}</div>`;
  }
  const finished = D>66;
  return `
  <div class="card row">
    ${ring(Math.min(D,66)/66,'var(--accent-2)')}
    <div class="grow">
      <div class="small muted">66 DAYS TO LIVE YOUR LIFE</div>
      <div style="font-size:1.4rem;font-weight:800">${finished?'¡Reto completado! 🎉':`Día ${D} de 66`}</div>
      <div class="small muted">${finished?'Puedes seguir jugando y subiendo de rango.':`Quedan ${66-D} días para que tus hábitos sean automáticos.`}</div>
    </div>
  </div>
  <div class="stat3"><div><b>${todayXp>=0?'+':''}${todayXp}</b><span class="small muted">XP hoy</span></div><div><b>🔥 ${sk}</b><span class="small muted">racha</span></div><div><b>${gDone}/${goods.length}</b><span class="small muted">hábitos</span></div></div>
  <div style="height:14px"></div>
  <div class="card coach"><div class="bot">🤖</div><div><b>Coach</b>${coach().map(l=>`<p class="small" style="margin-top:5px">${l}</p>`).join('')}</div></div>

  <div class="${editing?'editing':''}">
  <div class="card">
    <div class="row between" style="margin-bottom:10px"><h2 style="margin:0">✅ Hábitos buenos <span class="small muted">(+XP)</span></h2>
      <button class="btn ghost sm" onclick="editing=!editing;render()">${editing?'Listo':'Editar'}</button></div>
    ${goods.map(h=>habitCard(h,d)).join('')||'<p class="muted small">No tienes hábitos buenos. ¡Añade uno!</p>'}
    <button class="btn ghost block sm" style="margin-top:6px" onclick="habitForm('good')">+ Añadir hábito bueno</button>
  </div>
  <div class="card">
    <h2>⚠️ Hábitos malos <span class="small muted">(márcalo si caíste: −XP)</span></h2>
    ${bads.map(h=>habitCard(h,d)).join('')||'<p class="muted small">Sin hábitos malos registrados.</p>'}
    <button class="btn ghost block sm" style="margin-top:6px" onclick="habitForm('bad')">+ Añadir hábito malo</button>
  </div>
  </div>

  <div class="card">
    <h2>📅 Tus 66 días</h2>
    <div class="grid66">${grid}</div>
    <div class="row small muted" style="flex-wrap:wrap;gap:10px;margin-top:10px">
      <span><span class="pill" style="background:var(--gold);color:#2a1b00">■</span> Perfecto</span>
      <span><span class="pill" style="background:rgba(52,211,153,.55)">■</span> Cumplido ≥60%</span>
      <span><span class="pill" style="background:rgba(124,92,255,.35)">■</span> Parcial</span>
      <span><span class="pill" style="color:var(--bad)">●</span> Hábito malo</span>
    </div>
  </div>`;
}

function viewStats(){
  const now={}; SK.forEach(k=>now[k]=skillVal(k));
  const weak=[...SK].sort((a,b)=>now[a]-now[b]).slice(0,3);
  const total=Math.round(SK.reduce((a,k)=>a+now[k],0)/SK.length);
  const has=n=>S.habits.some(h=>h.name===n);
  return `
  <div class="card">
    <div class="row between"><h2 style="margin:0">🕸️ Tus habilidades</h2><span class="pill">Clase: ${charClass()}</span></div>
    <p class="small muted" style="margin-top:4px">Línea discontinua = cómo empezaste. Área morada = cómo estás ahora. Puntuación global: <b>${total}/100</b></p>
    <div class="radar-box"><canvas id="radar"></canvas></div>
    ${SK.map(k=>{const diff=now[k]-clamp(S.base[k]);return `<div class="skill-row"><span>${SKILLS[k].e}</span>
      <div><div class="row between small"><span>${SKILLS[k].n}</span><span class="muted">${diff>0?`<span style="color:var(--good)">▲${diff}</span>`:diff<0?`<span style="color:var(--bad)">▼${-diff}</span>`:''}</span></div>
      <div class="bar"><i style="width:${now[k]}%;background:${SKILLS[k].c}"></i></div></div><b style="text-align:right">${now[k]}</b></div>`}).join('')}
    <p class="small muted">Cada hábito bueno sube +1 su habilidad; cada hábito malo la baja −1,5.</p>
  </div>
  <div class="card">
    <h2>🎯 Lo que tienes que mejorar</h2>
    ${weak.map(k=>`<div class="rec" style="border-color:${SKILLS[k].c}">
      <b>${SKILLS[k].e} ${SKILLS[k].n} · ${now[k]}/100</b>
      <ul class="small muted" style="margin:6px 0 8px 18px">${RECS[k].tips.map(t=>`<li style="margin-bottom:3px">${t}</li>`).join('')}</ul>
      ${RECS[k].good.map(([n,xp,ic])=>`<div class="rec-h"><span>${ic} ${n} <span style="color:var(--good)">+${xp}</span></span>${has(n)?'<span class="small muted">✓ Añadido</span>':`<button class="btn sm" onclick="addRec('${k}','good','${esc(n)}')">+ Añadir</button>`}</div>`).join('')}
      ${RECS[k].bad.map(([n,xp,ic])=>`<div class="rec-h"><span>${ic} Evitar: ${n} <span style="color:var(--bad)">−${xp}</span></span>${has(n)?'<span class="small muted">✓ Vigilando</span>':`<button class="btn ghost sm" onclick="addRec('${k}','bad','${esc(n)}')">Vigilar</button>`}</div>`).join('')}
    </div>`).join('')}
  </div>
  <div class="card">
    <h2>📋 Más recomendaciones</h2>
    ${SK.filter(k=>!weak.includes(k)).map(k=>`<details style="margin-bottom:8px"><summary style="cursor:pointer;font-weight:600">${SKILLS[k].e} ${SKILLS[k].n} · ${now[k]}</summary>
      <div class="rec" style="margin-top:8px;border-color:${SKILLS[k].c}">
      ${RECS[k].good.map(([n,xp,ic])=>`<div class="rec-h"><span>${ic} ${n} <span style="color:var(--good)">+${xp}</span></span>${has(n)?'<span class="small muted">✓</span>':`<button class="btn sm" onclick="addRec('${k}','good','${esc(n)}')">+</button>`}</div>`).join('')}
      </div></details>`).join('')}
  </div>`;
}

function viewRank(){
  const ri=rankInfo(S.xp);
  const players=[...rivals(),{name:S.profile.name,xp:S.xp,me:true,color:ri.r.c}].sort((a,b)=>b.xp-a.xp);
  const pos=players.findIndex(p=>p.me)+1;
  const above=players[pos-2];
  return `
  <div class="card">
    <h2>⚔️ Liga 66 Days</h2>
    <p class="small muted" style="margin-bottom:10px">Compites contra otros jugadores que empezaron el reto el mismo día que tú. ${pos===1?'<b style="color:var(--gold)">¡Vas primero! 👑</b>':`Vas <b>#${pos}</b>. Para pasar a <b>${esc(above.name)}</b> te faltan <b>${fmt(above.xp-S.xp+1)} XP</b>.`}</p>
    ${players.map((p,i)=>`<div class="lb ${p.me?'me':''}"><span class="pos">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="dot" style="background:${p.color}"></span>
      <span class="grow" style="font-weight:${p.me?800:500};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}${p.me?' (tú)':''}</span>
      <span class="small muted">${RANKS[rankOf(p.xp)].n}</span><b style="min-width:70px;text-align:right">${fmt(p.xp)}</b></div>`).join('')}
    <p class="small muted" style="margin-top:8px">Los rivales son simulados y avanzan cada día. Algunos días fallan… como todos.</p>
  </div>
  <div class="card">
    <h2>🏅 Rangos</h2>
    <div class="ladder">${RANKS.map((r,i)=>`<div class="lv ${i<=ri.i?'got':''} ${i===ri.i?'cur':''}" style="--c:${r.c}">
      <span class="em">${r.i}</span><div class="grow"><b>${r.n}</b>${i===ri.i?` <span class="small" style="color:${r.c}">· ${ri.div||'MAX'} · Estás aquí</span>`:''}<div class="small muted">${fmt(r.min)} XP${AV.accs.find(a=>a[2]===i&&i>0)?` · desbloquea ${AV.accs.find(a=>a[2]===i)[1]}`:''}</div></div>
      ${i<=ri.i?'✅':'🔒'}</div>`).join('')}</div>
    <p class="small muted" style="margin-top:10px">Cada rango tiene 3 divisiones (III → II → I). Si marcas hábitos malos puedes <b>bajar</b> de rango.</p>
  </div>`;
}

function viewPerfil(){
  const a=S.avatar, ri=rankInfo(S.xp), best=Math.min(RANKS.length-1,Math.max(S.best||0,ri.i)), p=S.profile;
  const sw=(list,key)=>`<div class="opts">${list.map(c=>`<button class="sw ${a[key]===c?'on':''}" style="background:${c}" onclick="setAv('${key}','${c}')" aria-label="${c}"></button>`).join('')}</div>`;
  return `
  <div class="card" style="text-align:center">
    ${avatarSVG(a,ri.r.c,'avatar-big')}
    <h2 style="font-size:1.4rem;margin:6px 0 2px">${esc(p.name)}</h2>
    <div class="muted small">${charClass()} · <span style="color:${ri.r.c};font-weight:700">${ri.r.i} ${ri.r.n} ${ri.div}</span></div>
  </div>
  <div class="card">
    <h2>🎨 Personaliza tu personaje</h2>
    <label class="small muted">Piel</label>${sw(AV.skins,'skin')}
    <label class="small muted">Peinado</label>
    <div class="opts">${AV.hairs.map(([k,l])=>`<button class="opt ${a.hair===k?'on':''}" onclick="setAv('hair','${k}')">${l}</button>`).join('')}</div>
    <label class="small muted">Color de pelo</label>${sw(AV.hairColors,'hairColor')}
    <label class="small muted">Ropa</label>${sw(AV.shirts,'shirt')}
    <label class="small muted">Accesorio (se desbloquean subiendo de rango)</label>
    <div class="opts">${AV.accs.map(([k,l,r])=>{const lock=r>best;return `<button class="opt ${a.acc===k?'on':''} ${lock?'locked':''}" ${lock?`onclick="toast('🔒 Se desbloquea en ${RANKS[r].n}','bad')"`:`onclick="setAv('acc','${k}')"`}>${lock?'🔒 ':''}${l}</button>`}).join('')}</div>
    <p class="small muted">El aura de tu personaje toma el color de tu rango.</p>
  </div>
  <div class="card">
    <h2>📊 Tus datos</h2>
    <div class="small muted" style="line-height:1.8">
      Edad: <b>${p.age||'—'}</b> · Peso: <b>${p.weight||'—'} kg</b> · Altura: <b>${p.height||'—'} cm</b>
      ${p.weight&&p.height?` · IMC: <b>${(p.weight/Math.pow(p.height/100,2)).toFixed(1)}</b>`:''}<br>
      Reto iniciado: <b>${parseKey(S.start).toLocaleDateString('es-ES')}</b> · Mejor rango: <b>${RANKS[best].n}</b>
    </div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
      <button class="btn ghost sm" onclick="updWeight()">⚖️ Actualizar peso</button>
      <button class="btn danger sm" onclick="resetAll()">↺ Reiniciar</button>
    </div>
  </div>
  ${saveCard()}`;
}

function saveCard(){
  const last=S.lastBackup?new Date(S.lastBackup).toLocaleDateString('es-ES'):null;
  const old=!S.lastBackup || (Date.now()-S.lastBackup)>7*864e5;
  return `<div class="card" id="guardar">
    <h2>💾 Guardar mi progreso</h2>
    <p class="small muted" style="margin-bottom:10px">Tu progreso se guarda <b>automáticamente</b> en este dispositivo cada vez que marcas algo.
    Haz una copia de seguridad para no perderlo si cambias de móvil o borras el navegador.</p>
    <p class="small" style="margin-bottom:12px;color:${old?'var(--gold)':'var(--good)'}">${last?`Última copia: <b>${last}</b>`:'Aún no has hecho ninguna copia'}${old?' · ¡Haz una ahora!':' ✓'}</p>
    <div class="two">
      <button class="btn sm" onclick="exportData()">⬇️ Descargar copia</button>
      <button class="btn ghost sm" onclick="document.getElementById('imp').click()">📂 Restaurar archivo</button>
      <button class="btn ghost sm" onclick="copyCode()">📋 Copiar código</button>
      <button class="btn ghost sm" onclick="pasteCode()">🔑 Pegar código</button>
    </div>
    <input id="imp" type="file" accept="application/json,.json" class="hidden" onchange="importData(this)">
    <p class="small muted" style="margin-top:10px">El <b>código de guardado</b> es un texto con toda tu partida: pégalo en tus notas o envíatelo por WhatsApp/email y úsalo en otro móvil con «Pegar código».</p>
  </div>
  <div class="card">
    <h2>📲 Instalar como app</h2>
    ${isStandalone()?'<p class="small" style="color:var(--good)">✓ Ya estás usando la app instalada.</p>':`
    <p class="small muted" style="margin-bottom:10px">Instálala para abrirla desde un icono en tu pantalla de inicio, a pantalla completa y sin conexión.</p>
    ${installEvt?'<button class="btn block" onclick="installApp()">📲 Instalar 66 Days</button>':`
    <div class="small" style="line-height:1.7">
      <b>iPhone (Safari):</b> pulsa <b>Compartir</b> ⬆️ → <b>Añadir a pantalla de inicio</b>.<br>
      <b>Android (Chrome):</b> menú <b>⋮</b> → <b>Instalar aplicación</b> (o «Añadir a pantalla de inicio»).
    </div>`}`}
  </div>`;
}

/* ---------------- Guardado / app instalable ---------------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(S&&tab==='perfil') render() });
window.addEventListener('appinstalled',()=>{ installEvt=null; toast('¡App instalada! 📲','gold'); if(S) render() });
function isStandalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true }
function installApp(){ if(!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render() }) }
function markBackup(){ S.lastBackup=Date.now(); save(); render() }
function encodeSave(){ return 'D66:'+btoa(unescape(encodeURIComponent(JSON.stringify(S)))) }
function decodeSave(t){ t=t.trim().replace(/^D66:/,''); return JSON.parse(decodeURIComponent(escape(atob(t)))) }
function copyCode(){
  S.lastBackup=Date.now(); save();
  const code=encodeSave();
  const done=()=>{ toast('Código copiado ✅ Guárdalo en tus notas','good'); render() };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(code).then(done,()=>showCode(code));
  else showCode(code);
}
function showCode(code){
  openModal(`<h2>📋 Tu código de guardado</h2><p class="small muted" style="margin-bottom:8px">Mantén pulsado para copiarlo todo.</p>
  <textarea readonly style="width:100%;height:160px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:.7rem" onclick="this.select()">${code}</textarea>
  <button class="btn block" style="margin-top:10px" onclick="closeModal();render()">Hecho</button>`);
}
function pasteCode(){
  openModal(`<h2>🔑 Restaurar con código</h2><p class="small muted" style="margin-bottom:8px">Pega aquí tu código de guardado. <b>Se reemplazará la partida actual.</b></p>
  <textarea id="codeIn" placeholder="D66:..." style="width:100%;height:140px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:.75rem"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn grow" onclick="applyCode()">Restaurar</button></div>`);
}
function applyCode(){
  try{ const s=decodeSave(document.getElementById('codeIn').value); restore(s); closeModal() }
  catch(e){ toast('Código no válido','bad') }
}
function restore(s){
  if(!s||!s.habits||!s.base||!s.start) throw new Error('bad');
  S=s; S.best=Math.min(RANKS.length-1,S.best||0); save(); tab='hoy'; render(); toast('Partida restaurada ✅','good');
}
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}) }
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

function render(){
  if(!S){ renderOnboarding(); return }
  const v={hoy:viewHoy,stats:viewStats,rank:viewRank,perfil:viewPerfil}[tab]();
  document.getElementById('app').innerHTML = header()+`<main class="wrap">${v}</main>`+navbar();
  if(tab==='stats'){
    const now={}, init={}; SK.forEach(k=>{now[k]=skillVal(k);init[k]=clamp(S.base[k])});
    requestAnimationFrame(()=>drawRadar(document.getElementById('radar'),now,init));
  }
}

/* ---------------- Acciones ---------------- */
function setAv(k,v){ S.avatar[k]=v; save(); render() }
function delHabit(id){
  const h=S.habits.find(x=>x.id===id);
  if(!confirm(`¿Borrar "${h.name}"?`)) return;
  S.habits=S.habits.filter(x=>x.id!==id); save(); render();
}
function addRec(skill,type,name){
  const r=RECS[skill][type].find(x=>x[0]===name); if(!r) return;
  S.habits.push({id:uid(),name:r[0],type,xp:r[1],skill,icon:r[2]}); save(); render();
  toast(type==='good'?'Hábito añadido a "Hoy" ✅':'Ahora vigilas este hábito ⚠️', type==='good'?'good':'bad');
}
function habitForm(type){
  openModal(`<h2>${type==='good'?'✅ Nuevo hábito bueno':'⚠️ Nuevo hábito malo'}</h2>
  <div class="field"><label>Nombre</label><input type="text" id="hfN" maxlength="40" placeholder="${type==='good'?'Ej: Entrenar piernas':'Ej: Fumar'}"></div>
  <div class="two">
    <div class="field"><label>Habilidad</label><select id="hfS">${SK.map(k=>`<option value="${k}">${SKILLS[k].e} ${SKILLS[k].n}</option>`).join('')}</select></div>
    <div class="field"><label>${type==='good'?'XP que da':'XP que quita'}</label><select id="hfX">${[5,10,15,20,25,30,40,50].map(x=>`<option ${x===15?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>
  <div class="field"><label>Emoji (opcional)</label><input type="text" id="hfI" maxlength="4" placeholder="🔥"></div>
  <div class="row"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn grow" onclick="saveHabit('${type}')">Guardar</button></div>`);
  setTimeout(()=>document.getElementById('hfN').focus(),50);
}
function saveHabit(type){
  const n=document.getElementById('hfN').value.trim(); if(!n){toast('Ponle un nombre','bad');return}
  S.habits.push({id:uid(),name:n,type,skill:document.getElementById('hfS').value,xp:+document.getElementById('hfX').value,icon:document.getElementById('hfI').value.trim()});
  save(); closeModal(); render();
}
function updWeight(){
  const w=prompt('Tu peso actual (kg):',S.profile.weight||''); if(w===null) return;
  const n=parseFloat(String(w).replace(',','.')); if(!(n>30&&n<300)){toast('Peso no válido','bad');return}
  (S.profile.weights=S.profile.weights||[]).push({d:today(),w:n}); S.profile.weight=n; save(); render(); toast('Peso actualizado','good');
}
function exportData(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='66-days-'+today()+'.json'; a.click();
  markBackup(); toast('Copia descargada ✅','good');
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  f.text().then(t=>{ try{ restore(JSON.parse(t)) }catch(e){ toast('Archivo no válido','bad') } });
  inp.value='';
}
function resetAll(){
  if(!confirm('¿Seguro? Se borrará todo tu progreso y empezarás de cero.')) return;
  try{localStorage.removeItem(KEY)}catch(e){} S=null; ob.step=0; render();
}

let rz;
window.addEventListener('resize',()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{
    const c=document.getElementById('radar'); if(!S||tab!=='stats'||!c) return;
    const now={}, init={}; SK.forEach(k=>{now[k]=skillVal(k);init[k]=clamp(S.base[k])});
    drawRadar(c,now,init);
  },150);
});
render();
</script>
</body>
</html>
