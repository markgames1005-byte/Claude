<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f1a">
<title>66 Days to Live Your Life</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="66 Days">
<meta name="description" content="Convierte tu vida en un videojuego: reto de 66 días, hábitos con experiencia, cofres diarios, misiones, rangos de Madera a Dios y rivales.">
<style>
  :root{
    --bg:#0d0f1a; --bg-2:#141728; --card:#1a1e33; --card-2:#222742; --border:#2e3456;
    --text:#eef0ff; --text-2:#a8aed6; --text-3:#6f76a3;
    --accent:#7c5cff; --accent-2:#22d3ee; --good:#34d399; --bad:#f87171; --gold:#fbbf24; --curse:#a855f7;
    --rank:#a0703c; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(700px 400px at 110% 10%, rgba(34,211,238,.12), transparent 60%),
      var(--bg);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;padding-bottom:90px;
    -webkit-tap-highlight-color:transparent;
  }
  body.cursed{background:radial-gradient(900px 500px at 50% -10%, rgba(168,85,247,.22), transparent 60%),radial-gradient(600px 400px at 100% 100%, rgba(127,29,29,.25), transparent 60%),var(--bg);background-attachment:fixed}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font:inherit;color:var(--text)}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  h1,h2,h3{line-height:1.2}
  h2{font-size:1.1rem;margin-bottom:12px;letter-spacing:.02em}
  .muted{color:var(--text-2)} .small{font-size:.82rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:12px} .between{justify-content:space-between} .grow{flex:1;min-width:0}
  .btn{background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;letter-spacing:.02em;transition:transform .1s,filter .15s}
  .btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.96)}
  .btn.ghost{background:var(--card-2);color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:#7f1d1d} .btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#2a1b00}
  .btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px;white-space:nowrap;flex:none}
  .btn.block{width:100%}
  .two .btn.sm{white-space:normal;padding:9px 8px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);font-size:.8rem;font-weight:600}

  /* Header */
  header.top{position:sticky;top:0;z-index:20;background:rgba(13,15,26,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
  header.top .wrap{padding:10px 16px}
  .hdr-avatar{width:48px;height:48px;flex:none}
  .rank-badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;padding:3px 10px;border-radius:999px;color:#111;background:var(--rank);box-shadow:0 0 14px color-mix(in srgb,var(--rank) 60%,transparent);white-space:nowrap}
  .xpbar{height:8px;background:var(--card-2);border-radius:99px;overflow:hidden;margin-top:6px}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1.2);position:relative}
  .xpbar > i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:shine 2.8s infinite}
  @keyframes shine{60%,100%{transform:translateX(100%)}}
  .hdr-chips{display:flex;gap:6px;margin-top:4px}
  .hdr-chips span{font-size:.75rem;font-weight:700;color:var(--text-2)}
  .bump{animation:bump .45s}
  @keyframes bump{30%{transform:scale(1.15)}}

  /* Nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(20,23,40,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .wrap{display:flex;padding:6px 8px}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;font-size:.72rem;color:var(--text-3);font-weight:600;position:relative}
  nav.tabs button span{font-size:1.35rem;line-height:1}
  nav.tabs button.on{color:var(--text);background:var(--card-2)}
  nav.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}

  /* Hero */
  .hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(34,211,238,.08));border-color:rgba(124,92,255,.45)}
  .bigring{width:96px;height:96px;flex:none;position:relative}
  .bigring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.3rem;font-weight:900}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat3 div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
  .stat3 b{display:block;font-size:1.2rem}

  /* Chest */
  .chest{display:flex;align-items:center;gap:14px;cursor:pointer;background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(245,158,11,.08));border-color:rgba(251,191,36,.6);animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 26px rgba(251,191,36,.35)}}
  .chest .ce{font-size:2.6rem;animation:wiggle 1.4s ease-in-out infinite}
  @keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}80%{transform:rotate(12deg)}90%{transform:rotate(-6deg)}}
  .chest-open .big{font-size:5rem;display:inline-block;animation:shake .7s}
  @keyframes shake{0%,100%{transform:none}20%{transform:rotate(-15deg) scale(1.1)}40%{transform:rotate(15deg) scale(1.15)}60%{transform:rotate(-10deg) scale(1.2)}80%{transform:rotate(8deg) scale(1.1)}}

  /* Missions */
  .mis{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--border)}
  .mis:first-of-type{border-top:none}
  .mis .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:.8rem;flex:none}
  .mis.ok .mk{background:var(--gold);border-color:var(--gold);color:#2a1b00}
  .mis.ok .mt{text-decoration:line-through;color:var(--text-2)}
  .mis .mx{font-weight:800;font-size:.8rem;color:var(--gold);white-space:nowrap}

  /* Curse */
  .curse{background:linear-gradient(160deg,rgba(88,28,135,.55),rgba(127,29,29,.35));border:1px solid var(--curse);box-shadow:0 0 30px rgba(168,85,247,.25)}
  .curse h2{color:#e9d5ff}
  .ctask{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(0,0,0,.25);margin-top:8px;cursor:pointer}
  .ctask .check{border-color:#7e22ce}
  .ctask.done .check{background:var(--curse);border-color:var(--curse);color:#fff}
  .ctask.done span{text-decoration:line-through;opacity:.7}
  .skull{font-size:4rem;animation:float 2.5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  .cursed-av{filter:grayscale(.85) brightness(.85)}

  /* Habits */
  .habit{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--card-2);border:1px solid var(--border);margin-bottom:8px;transition:background .2s,border-color .2s,transform .15s}
  .habit .ic{font-size:1.4rem;width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--bg-2);flex:none}
  .habit .nm{font-weight:600;overflow-wrap:anywhere}
  .habit .xp{font-weight:800;font-size:.85rem;white-space:nowrap}
  .habit.good .xp{color:var(--good)} .habit.bad .xp{color:var(--bad)}
  .check{width:38px;height:38px;border-radius:11px;border:2px solid var(--border);display:grid;place-items:center;flex:none;font-size:1.1rem;font-weight:900;transition:all .15s}
  .minib{height:38px;padding:0 8px;border-radius:11px;border:1px dashed var(--border);font-size:.72rem;font-weight:700;color:var(--text-2);flex:none;line-height:1.1}
  .habit.good.done{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.5)}
  .habit.good.done .check{background:var(--good);border-color:var(--good);color:#06281b;animation:pop .35s}
  .habit.good.done.mini .check{background:rgba(52,211,153,.45)}
  .habit.bad.done{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.5)}
  .habit.bad.done .check{background:var(--bad);border-color:var(--bad);color:#3b0909}
  .habit .del{color:var(--text-3);font-size:1.1rem;padding:4px 8px;display:none}
  .editing .habit .del{display:block}
  .editing .habit .check,.editing .habit .minib{display:none}
  .lvlup{font-size:.72rem;font-weight:800;color:var(--gold);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.5);padding:2px 8px;border-radius:99px;margin-top:4px;display:inline-block}
  .mini-txt{font-size:.75rem;color:var(--text-3);margin-top:2px}

  /* Day grid */
  .grid66{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
  .grid66 div{aspect-ratio:1;border-radius:6px;background:var(--card-2);display:grid;place-items:center;font-size:.62rem;color:var(--text-3);position:relative}
  .grid66 .partial{background:rgba(124,92,255,.35);color:var(--text)}
  .grid66 .done{background:rgba(52,211,153,.55);color:#04140d}
  .grid66 .perfect{background:var(--gold);color:#2a1b00;font-weight:800}
  .grid66 .shield{background:rgba(56,189,248,.45);color:#031c2b}
  .grid66 .miss{background:rgba(248,113,113,.18)}
  .grid66 .ms{box-shadow:inset 0 0 0 2px rgba(251,191,36,.6)}
  .grid66 .today{outline:2px solid var(--accent-2);outline-offset:1px;color:var(--text)}
  .grid66 .badmark::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--bad)}

  /* Coach */
  .coach{display:flex;gap:12px;align-items:flex-start}
  .coach .bot{font-size:1.8rem;flex:none}

  /* Stats */
  .radar-box{position:relative;width:100%;max-width:420px;margin:0 auto}
  canvas{display:block;width:100%;height:auto}
  .skill-row{display:grid;grid-template-columns:28px 1fr 44px;align-items:center;gap:10px;margin-bottom:9px}
  .skill-row .bar{height:9px;border-radius:99px;background:var(--card-2);overflow:hidden}
  .skill-row .bar i{display:block;height:100%;border-radius:99px}
  .rec{border-left:3px solid var(--accent);padding:10px 12px;background:var(--card-2);border-radius:0 12px 12px 0;margin-bottom:10px}
  .rec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px dashed var(--border);font-size:.9rem}
  .rec-h:first-of-type{border-top:none}
  .rec-h > span:last-child{white-space:nowrap}

  /* Ranking */
  .ladder{display:flex;flex-direction:column-reverse;gap:6px}
  .ladder .lv{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--border);opacity:.55}
  .ladder .lv.got{opacity:1}
  .ladder .lv.cur{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px color-mix(in srgb,var(--c) 40%,transparent);opacity:1}
  .ladder .em{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;background:var(--c);flex:none}
  .lb{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;margin-bottom:6px;background:var(--card-2)}
  .lb.me{background:linear-gradient(90deg,rgba(124,92,255,.35),rgba(34,211,238,.15));border:1px solid var(--accent)}
  .lb .pos{width:26px;text-align:center;font-weight:800;color:var(--text-2)}
  .lb .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .ach{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;font-size:.72rem}
  .ach .ae{font-size:1.7rem;display:block;margin-bottom:4px}
  .ach b{display:block;font-size:.78rem;margin-bottom:2px}
  .ach.lock{opacity:.4} .ach.lock .ae{filter:grayscale(1)}
  .ach.got{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.08)}

  /* Avatar editor */
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
  .opt{padding:7px 12px;border-radius:10px;background:var(--card-2);border:2px solid var(--border);font-size:.85rem;font-weight:600}
  .opt.on{border-color:var(--accent);background:rgba(124,92,255,.2)}
  .opt.locked{opacity:.4;cursor:not-allowed}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--border)}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .avatar-big{width:180px;height:220px;margin:0 auto;display:block}

  /* Onboarding */
  .ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-bottom:0}
  .ob h1{font-size:1.8rem;margin-bottom:6px}
  .ob .logo{font-size:.8rem;letter-spacing:.3em;color:var(--accent-2);font-weight:800;margin-bottom:10px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.85rem;color:var(--text-2);margin-bottom:6px;font-weight:600}
  .field input[type=text],.field input[type=number],.field select{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg-2);border:1px solid var(--border);outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .range{display:flex;align-items:center;gap:12px}
  .range input{flex:1;accent-color:var(--accent)}
  .range b{min-width:42px;text-align:right}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border-radius:999px;background:var(--bg-2);border:2px solid var(--border);font-weight:600;font-size:.9rem}
  .chip.on{border-color:var(--accent);background:rgba(124,92,255,.25)}
  .steps{display:flex;gap:6px;margin-bottom:22px}
  .steps i{flex:1;height:5px;border-radius:9px;background:var(--card-2)}
  .steps i.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .howto li{margin:0 0 6px 18px}

  /* Modal & toast */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(5,6,12,.75);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:16px}
  .modal.show{display:flex}
  .modal .sheet{width:100%;max-width:520px;background:var(--bg-2);border:1px solid var(--border);border-radius:20px;padding:20px;max-height:90vh;overflow:auto;animation:up .25s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:0}}
  @media(min-width:600px){.modal{align-items:center}}
  .toasts{position:fixed;top:calc(80px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:400px}
  .toast{padding:10px 16px;border-radius:12px;font-weight:800;background:var(--card);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease-out;text-align:center}
  .toast.good{color:var(--good)} .toast.bad{color:var(--bad)} .toast.gold{color:var(--gold)} .toast.curse{color:#d8b4fe;border-color:var(--curse)}
  @keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
  .center{text-align:center}
  .bigemoji{font-size:4rem;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
  .ring{width:64px;height:64px;flex:none}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:70}
  .hidden{display:none!important}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* =========================================================
   66 DAYS TO LIVE YOUR LIFE — tu vida como un videojuego
   Todo se guarda en el navegador (localStorage).
   ========================================================= */

/* Umbrales calibrados para un reto de 66 días: el primer rango cae en 1-2 días,
   y Dios exige constancia (~100 XP diarios) pero es alcanzable. */
const RANKS = [
  {n:'Madera',       min:0,    c:'#a0703c', i:'🪵'},
  {n:'Bronce',       min:150,  c:'#cd7f32', i:'🥉'},
  {n:'Plata',        min:400,  c:'#c3cad6', i:'🥈'},
  {n:'Oro',          min:800,  c:'#fbbf24', i:'🥇'},
  {n:'Platino',      min:1400, c:'#5eead4', i:'💠'},
  {n:'Rubí',         min:2200, c:'#f43f72', i:'♦️'},
  {n:'Campeón',      min:3200, c:'#fb923c', i:'🏆'},
  {n:'Gran Campeón', min:4500, c:'#c084fc', i:'👑'},
  {n:'Dios',         min:6500, c:'#fff3b0', i:'🌟'},
];

const SKILLS = {
  fuerza:     {n:'Fuerza',      e:'💪', c:'#f87171'},
  resistencia:{n:'Resistencia', e:'🏃', c:'#fb923c'},
  nutricion:  {n:'Nutrición',   e:'🥗', c:'#34d399'},
  sueno:      {n:'Sueño',       e:'😴', c:'#818cf8'},
  mente:      {n:'Mente',       e:'🧘', c:'#c084fc'},
  intelecto:  {n:'Intelecto',   e:'📚', c:'#22d3ee'},
  social:     {n:'Social',      e:'🤝', c:'#f472b6'},
  finanzas:   {n:'Finanzas',    e:'💰', c:'#fbbf24'},
};
const SK = Object.keys(SKILLS);

/* Cada hábito tiene 3 niveles:
   n = normal, e = fácil (para quien empieza), m = versión mínima ("nunca cero", media XP) */
const RECS = {
  fuerza:{
    tips:['Entrena fuerza 3-4 días por semana con progresión (más peso o repeticiones cada semana).','Prioriza básicos: sentadilla, peso muerto, press y dominadas.','Come suficiente proteína (aprox. 1,6-2 g por kg de peso).'],
    good:[
      {n:'Entreno de fuerza 45 min',e:'Entreno de fuerza 20 min en casa',m:'10 sentadillas',xp:30,ic:'🏋️'},
      {n:'50 flexiones repartidas en el día',e:'15 flexiones (vale con rodillas)',m:'3 flexiones',xp:15,ic:'💪'},
      {n:'Escaleras en vez de ascensor',e:'Subir 2 pisos por escaleras',m:'Un tramo de escaleras',xp:8,ic:'🪜'}],
    bad:[{n:'Saltarme el entreno planificado',xp:20,ic:'🛋️'}]},
  resistencia:{
    tips:['Empieza con 20-30 min de cardio suave (puedes hablar mientras lo haces).','Sube el volumen un 10% por semana como máximo.','Caminar cuenta: apunta a 8.000-10.000 pasos diarios.'],
    good:[
      {n:'Correr / bici / nadar 30 min',e:'Caminar rápido 20 min',m:'Caminar 5 min',xp:25,ic:'🏃'},
      {n:'10.000 pasos',e:'6.000 pasos',m:'Un paseo de 5 min',xp:20,ic:'👟'},
      {n:'HIIT o comba 10 min',e:'5 min de comba o saltos',m:'1 min de saltos',xp:12,ic:'⏱️'}],
    bad:[{n:'Más de 8 h sentado sin moverme',xp:10,ic:'🪑'}]},
  nutricion:{
    tips:['Llena medio plato con verdura en cada comida principal.','Bebe agua antes de cada comida; 2 L al día es un buen objetivo.','Planifica y cocina tus comidas: reduce ultraprocesados.'],
    good:[
      {n:'3 raciones de fruta/verdura',e:'1 ración extra de fruta o verdura',m:'Comer una pieza de fruta',xp:15,ic:'🥦'},
      {n:'Beber 2 L de agua',e:'Beber 1,5 L de agua',m:'Un vaso de agua al despertar',xp:10,ic:'💧'},

/* Migra partidas antiguas al formato actual */
function migrate(){
  if(!S) return;
  S.habits.forEach(h=>{ if(h.type==='good' && !h.mini) h.mini='Versión mínima (2 min)'; h.count=h.count||0 });
  S.stats=Object.assign({good:0,chests:0,perfect:0,mini:0,lvlup:0,skills:{},redeemed:0,missions:0},S.stats||{});
  S.ach=S.ach||{}; S.shields=S.shields||0;
  if(S.sound===undefined) S.sound=true;
  if(!S.lastProcessed) S.lastProcessed=addDays(today(),-1) > addDays(S.start,-1) ? addDays(today(),-1) : addDays(S.start,-1);
  S.best=Math.min(RANKS.length-1,Math.max(S.best||0,rankOf(S.xp)));
  S.v=2;
}

function rankOf(xp){ let i=0; RANKS.forEach((r,k)=>{ if(xp>=r.min) i=k }); return i }
function rankInfo(xp){
  const i=rankOf(xp), r=RANKS[i], next=RANKS[i+1];
  if(!next) return {i,r,div:'',dn:3,pct:100,toNext:0,next:null};
  const span=next.min-r.min, into=xp-r.min, dn=Math.min(2,Math.floor(into/(span/3)));
  return {i,r,div:['III','II','I'][dn],dn,pct:into/span*100,toNext:next.min-xp,next};
}
function skillVal(k){ return clamp(S.base[k]+(S.delta[k]||0),0,100) }
function bumpSkill(k,v){ const b=S.base[k]; S.delta[k]=Math.max(-b,Math.min(100-b,(S.delta[k]||0)+v)) }
function weakest(){ return [...SK].sort((a,b)=>skillVal(a)-skillVal(b))[0] }
function getDay(k=today()){ return S.days[k] || (S.days[k]={done:{},mini:{},bonus:0,mis:{}}) }

/* Nivel físico del jugador según perfil: 0 principiante, 1 intermedio, 2 avanzado */
function fitTier(){
  const p=S.profile, f=(skillVal('fuerza')+skillVal('resistencia'))/2;
  let t=f<40?0:f<70?1:2;
  if((+p.age||0)>=55 || bmiOf(p)>=30) t=Math.max(0,t-1);
  return t;
}
/* ¿Le damos la versión fácil del hábito? */
function easyFor(skill, base=S.base, p=S.profile){
  const phys = skill==='fuerza'||skill==='resistencia';
  if(phys && ((+p.age||0)>=55 || bmiOf(p)>=30)) return true;
  return (base[skill]??50) < 50;
}
function makeHabit(skill, rec, type, base, p){
  if(type==='bad') return {id:uid(),name:rec.n,type:'bad',xp:rec.xp,skill,icon:rec.ic,count:0};
  const easy=easyFor(skill,base,p);
  return {id:uid(),name:easy?rec.e:rec.n,normal:rec.n,mini:rec.m,lvl:easy?'easy':'normal',type:'good',xp:rec.xp,skill,icon:rec.ic,count:0};
}

/* Estado de un día: perfecto / cumplido (≥50 %) / parcial / escudo */
function dayStatus(k){
  const d=S.days[k];
  if(!d) return {cls:'',bad:0,r:0,g:0};
  if(d.shield) return {cls:'shield',bad:0,r:1,g:0};
  const vals=Object.values(d.done);
  const g=vals.filter(v=>v>0).length, bad=vals.filter(v=>v<0).length;
  const tot = k===today() ? goods().length : (d.g||goods().length);
  if(!tot) return {cls:'',bad,r:0,g};
  const r=Math.min(1,g/tot);
  const cls = r===0?'':(r>=1&&!bad)?'perfect':r>=.5?'done':'partial';
  return {cls,bad,r,g};
}
const okDay=c=>c==='done'||c==='perfect'||c==='shield';
function streak(){
  let n=0, k=today();
  if(okDay(dayStatus(k).cls)) n++;
  k=addDays(k,-1);
  while(daysBetween(S.start,k)>=0 && okDay(dayStatus(k).cls)){ n++; k=addDays(k,-1) }
  return n;
}
function mult(){ return 1+Math.min(streak(),10)*.05 }

/* ---------------- Rivales simulados ---------------- */
function rivals(){
  const D=dayIndex(), hourFrac=Math.max(.1,new Date().getHours()/24);
  return RIVAL_NAMES.map((name,i)=>{
    const r=rng(S.seed+i*977);
    const rate=35+r()*95, flake=.1+r()*.3;
    let xp=0;
    for(let d=0; d<D; d++){
      let gain = r()<flake ? -rate*.3*r() : rate*(.6+r()*.8);
      if(d===D-1) gain*=hourFrac;
      xp=Math.max(0,xp+gain);
    }
    return {name,xp:Math.round(xp),color:RANKS[rankOf(xp)].c};
  });
}
function league(){ return [...rivals(),{name:S.profile.name,xp:S.xp,me:true,color:RANKS[rankOf(S.xp)].c}].sort((a,b)=>b.xp-a.xp) }

/* ---------------- Sonido, vibración y confeti ---------------- */
let actx=null;
function sfx(type){
  if(!S||!S.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq={good:[660,880],mini:[520,660],bad:[300,200],rank:[523,659,784,1047],chest:[784,988,1175,1568],curse:[220,185,147],ach:[880,1175,1568],div:[660,990]}[type]||[600];
    seq.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*.09;
      o.type=type==='bad'||type==='curse'?'sawtooth':'triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.25);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(type==='bad'||type==='curse'?[60,40,60]:type==='rank'||type==='chest'?[30,30,30,30,80]:15) }catch(e){}
}
function confetti(n=90, colors){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.id='fx'; document.body.appendChild(c);
  const W=c.width=innerWidth, H=c.height=innerHeight, x=c.getContext('2d');
  const cols=colors||['#7c5cff','#22d3ee','#34d399','#fbbf24','#f472b6','#fff'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;
  (function tick(){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.globalAlpha=Math.max(0,1-f/110); x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); x.restore() });
    if(++f<110) requestAnimationFrame(tick); else c.remove();
  })();
}

/* ---------------- Coach ---------------- */
function coach(){
  const h=new Date().getHours(), st=dayStatus(today()), d=getDay(), G=goods();
  const done=G.filter(x=>d.done[x.id]!==undefined).length;
  const w=weakest(), ri=rankInfo(S.xp), sk=streak(), name=esc(S.profile.name||'jugador');
  const lines=[];
  if(S.curse) lines.push(`Estás maldito, ${name}. Completa la misión de redención antes de que se acabe el tiempo: es dura, pero está hecha a tu medida.`);
  else if(st.bad) lines.push(`Has marcado un hábito malo. Un mal momento no define tu partida: compénsalo ahora con un hábito bueno.`);
  else if(done===0 && h<12) lines.push(`Buenos días, ${name}. Empieza por el hábito más fácil. ¿No tienes ganas? Haz solo la <b>versión mínima</b>: lo importante es no hacer cero.`);
  else if(done===0) lines.push(`Aún no has sumado XP hoy. Elige UN hábito y haz al menos su versión mínima en los próximos 10 minutos.`);
  else if(st.cls==='perfect') lines.push(`¡Día perfecto! 🔥 Mañana te espera otro cofre.`);
  else if(st.r<.5) lines.push(`Llevas ${done}/${G.length}. Con ${Math.ceil(G.length/2)-done} más el día cuenta para la racha.`);
  else lines.push(`Día asegurado para la racha ✅ ${G.length-done} más y es día perfecto (+50 XP).`);
  if(ri.next && ri.toNext<=60) lines.push(`¡Solo ${fmt(ri.toNext)} XP para ${ri.next.i} ${ri.next.n}!`);
  else if(sk>=2) lines.push(`Racha de ${sk} días → tus hábitos dan x${mult().toFixed(2)} XP.`);
  else lines.push(`Consejo para ${SKILLS[w].e} ${SKILLS[w].n}: ${RECS[w].tips[dayIndex()%RECS[w].tips.length]}`);
  return lines;
}

  weak:{t:d=>`Completa un hábito de ${SKILLS[d.mw].e} ${SKILLS[d.mw].n}`,xp:15,c:d=>S.habits.some(h=>h.type==='good'&&h.skill===d.mw&&d.done[h.id]>0)},
  full2:{t:()=>'Completa 2 hábitos en versión completa (no mínima)',xp:15,c:d=>Object.entries(d.done).filter(([id,v])=>v>0&&!d.mini[id]).length>=2},

};
const gdone=d=>Object.values(d.done).filter(v=>v>0).length;
function todaysMissions(){
  const d=getDay();
  if(!d.ms){
    const r=rng(hash(today())+S.seed);
    const pool=['three','weak','full2','half']; if(new Date().getHours()<11) pool.push('early','early');
    const pick=[r()<.5?'chest':'stats'];
    while(pick.length<3){ const m=pool[r()*pool.length|0]; if(!pick.includes(m)) pick.push(m) }
    d.ms=pick;
    const hasWeak=S.habits.filter(h=>h.type==='good').map(h=>h.skill);
    d.mw=[...SK].sort((a,b)=>skillVal(a)-skillVal(b)).find(k=>hasWeak.includes(k))||weakest();
    save();
  }
  return d.ms;
}
function evalMissions(){
  const d=getDay(); d.mis=d.mis||{};
  todaysMissions().forEach(id=>{
    const m=MIS[id], ok=m.c(d);
    if(ok && d.mis[id]===undefined){ d.mis[id]=m.xp; S.stats.missions++; addXp(m.xp,'mis'); setTimeout(()=>{ toast(`📜 Misión cumplida +${m.xp} XP`,'gold'); sfx('ach') },500) }
    else if(!ok && d.mis[id]!==undefined){ addXp(-d.mis[id],'undo'); delete d.mis[id]; S.stats.missions-- }
  });
}

/* Procesa los días cerrados desde la última vez: castigos, escudos e hitos */
function processDays(){
  if(!S) return;
  const y=addDays(today(),-1);
  let k=addDays(S.lastProcessed,1), missedPen=0, missedDays=0, shieldsUsed=0, trigger=null, badName=null;
  while(daysBetween(k,y)>=0 && daysBetween(S.start,k)>=0){
    const day=S.days[k], st=dayStatus(k);
    const badCount=st.bad, ok=okDay(st.cls) && badCount<3;
    if(!ok && S.shields>0 && badCount<3){
      S.shields--; shieldsUsed++; (S.days[k]=S.days[k]||{done:{},mini:{},bonus:0,mis:{}}).shield=true; S.missRun=0;
    } else if(!ok){
      S.missRun=(S.missRun||0)+1;
      if(st.g===0){ missedPen+=15; missedDays++ }
    } else S.missRun=0;
    S.badRun = badCount>0 ? (S.badRun||0)+1 : 0;
    if(badCount>0 && day){ const ids=Object.entries(day.done).filter(([,v])=>v<0).map(([id])=>id); const h=S.habits.find(x=>x.id===ids[0]); if(h) badName=h.name }
    if(!S.curse && !trigger){
      if(S.badRun>=3 || badCount>=3) trigger='bad';
      else if(S.missRun>=2) trigger='miss';
    }
    k=addDays(k,1);
  }
  S.lastProcessed=y;
  missedPen=Math.min(missedPen,150);
  if(missedPen){ addXp(-missedPen,'penalty'); setTimeout(()=>toast(`💤 ${missedDays} día(s) sin hábitos: −${missedPen} XP`,'bad'),600) }
  if(shieldsUsed) setTimeout(()=>toast(`🛡️ Tu escudo protegió tu racha (${shieldsUsed})`,'good'),900);
  if(trigger){ S.missRun=0; S.badRun=0; startCurse(trigger,badName) }
  if(S.curse && Date.now()>S.curse.deadline){
    const extra=Math.min(S.xp,Math.max(40,Math.round(S.xp*.05)));
    addXp(-extra,'penalty'); S.curse.lost+=extra; S.curse.fails++; S.curse.deadline=Date.now()+48*3600e3;
    pending.push(()=>{ sfx('curse'); openModal(`<div class="center"><div class="skull">⌛</div><h2 style="margin:8px 0">Se acabó el tiempo</h2>
      <p class="muted" style="margin-bottom:14px">No completaste la redención: pierdes <b>${extra} XP</b> más. Tienes otras 48 h. Tú puedes.</p>
      <button class="btn block" style="background:var(--curse)" onclick="closeModal()">Esta vez sí</button></div>`) });
  }
  // hitos del reto
  const D=dayIndex();
  Object.entries(MILESTONES).forEach(([m,xp])=>{
    if(D>=+m && !S.ach['m'+m]){ S.ach['m'+m]=today(); addXp(xp,'ms'); setTimeout(()=>{ toast(`🏁 ¡Día ${m} del reto! +${xp} XP`,'gold'); confetti(60) },1200) }
  });
  save();
}

/* ---------------- Marcar hábitos ---------------- */
function toggleHabit(id, mini=false){
  const h=S.habits.find(x=>x.id===id); if(!h) return;
  const d=getDay(); d.mini=d.mini||{};
  if(d.done[id]!==undefined){
    addXp(-d.done[id],'undo');
    if(h.type==='good'){ bumpSkill(h.skill,d.mini[id]?-.5:-1); S.stats.good--; h.count=Math.max(0,(h.count||0)-1); if(d.mini[id]) S.stats.mini-- }
    else bumpSkill(h.skill,1.5);
    delete d.done[id]; delete d.mini[id];
    toast('Deshecho ↩','');
  }else{
    let amt;
    if(h.type==='good'){
      amt=Math.max(1,Math.round(h.xp*mult()*(mini?.5:1)*(S.curse?.5:1)));
      bumpSkill(h.skill,mini?.5:1); S.stats.good++; S.stats.skills[h.skill]=1; h.count=(h.count||0)+1;
      if(mini){ d.mini[id]=true; S.stats.mini++ }
      if(!d.firstAt){ d.firstAt=Date.now(); if(new Date().getHours()<12) d.early=true }
      sfx(mini?'mini':'good');
    } else { amt=-h.xp; bumpSkill(h.skill,-1.5); sfx('bad') }
    d.done[id]=amt; addXp(amt, h.type==='bad'?'bad':'good');
    toast(`${amt>0?'+':''}${amt} XP · ${SKILLS[h.skill].e} ${SKILLS[h.skill].n} ${amt>0?'▲':'▼'}${S.curse&&amt>0?' (maldito ½)':''}`, amt>0?'good':'bad');
  }
  d.g=goods().length;
  const st=dayStatus(today());
  if(st.cls==='perfect' && !d.bonus){ d.bonus=50; S.stats.perfect++; addXp(50,'bonus'); setTimeout(()=>{ toast('🔥 ¡DÍA PERFECTO! +50 XP','gold'); confetti(); sfx('rank') },250) }
  else if(st.cls!=='perfect' && d.bonus){ addXp(-d.bonus,'undo'); d.bonus=0; S.stats.perfect-- }
  evalMissions(); checkAch(); save(); render();
}
function levelUpHabit(id){

}

/* ---------------- Radar (gráfico de telaraña) ---------------- */
function drawRadar(canvas, now, initial){
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1, W=canvas.clientWidth||360, H=W;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const cx=W/2, cy=H/2, R=W*.31, n=SK.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(a)*R*v/100, cy+Math.sin(a)*R*v/100]};
  ctx.clearRect(0,0,W,H);
  for(let l=1;l<=5;l++){
    ctx.beginPath(); SK.forEach((k,i)=>{const [x,y]=pt(i,l*20); i?ctx.lineTo(x,y):ctx.moveTo(x,y)}); ctx.closePath();
    ctx.strokeStyle='rgba(168,174,214,.18)'; ctx.lineWidth=1; ctx.stroke();
  }
  SK.forEach((k,i)=>{const [x,y]=pt(i,100); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.strokeStyle='rgba(168,174,214,.14)'; ctx.stroke()});
  const poly=(vals,fill,stroke,dash)=>{
    ctx.beginPath(); SK.forEach((k,i)=>{const [x,y]=pt(i,vals[k]); i?ctx.lineTo(x,y):ctx.moveTo(x,y)}); ctx.closePath();
    if(fill){ctx.fillStyle=fill; ctx.fill()}
    ctx.setLineDash(dash||[]); ctx.strokeStyle=stroke; ctx.lineWidth=2.2; ctx.stroke(); ctx.setLineDash([]);
  };
  if(initial) poly(initial,null,'rgba(168,174,214,.55)',[5,5]);
  poly(now,'rgba(124,92,255,.32)','#8b6cff');
  SK.forEach((k,i)=>{const [x,y]=pt(i,now[k]); ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fillStyle=SKILLS[k].c; ctx.fill()});
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const fs=Math.max(11,W*.034);
  SK.forEach((k,i)=>{
    const [x,y]=pt(i,128);
    ctx.font=`${fs*1.3}px system-ui`; ctx.fillStyle='#000'; ctx.fillText(SKILLS[k].e,x,y-fs*1.1);
    ctx.font=`600 ${fs}px system-ui`; ctx.fillStyle='#a8aed6'; ctx.fillText(SKILLS[k].n,x,y+fs*.2);
    ctx.font=`800 ${fs}px system-ui`; ctx.fillStyle='#eef0ff'; ctx.fillText(now[k],x,y+fs*1.3);
  });
}

function computeBase(d){
  const bmi = d.weight&&d.height ? d.weight/Math.pow(d.height/100,2) : 22;
  const bmiPen = bmi<18.5||bmi>=25 ? (bmi>=30?14:7) : 0;
  const sleepMap={4:22,5:35,6:55,7:78,8:92,9:86,10:70};
  return {
    fuerza: clamp(14+d.gym*13),
    resistencia: clamp(14+d.cardio*13-(bmi>=30?10:0)),
    nutricion: clamp(32+d.veg*10-d.fast*6+d.water*6-bmiPen),
    sueno: clamp(sleepMap[d.sleep]??50),
    mente: clamp(100-(d.stress-1)*18-Math.max(0,d.phone-3)*4),
    intelecto: clamp(18+d.read*1.1-Math.max(0,d.phone-4)*3),
    social: clamp(d.social*19),
    finanzas: clamp(d.money*19),
    bmi
  };
}

function obGoal(k){ const g=ob.d.goals; if(g.includes(k)) g.splice(g.indexOf(k),1); else { if(g.length>=3) g.shift(); g.push(k) } renderOnboarding() }
function obNext(){
  if(ob.step===1 && !ob.d.name.trim()){ toast('Escribe tu nombre de jugador','bad'); return }
  ob.step++; renderOnboarding(); window.scrollTo(0,0);
}
function obFinish(){
  const d=ob.d, b=computeBase(d); delete b.bmi;
  const p={name:d.name.trim(),age:d.age,sex:d.sex,weight:d.weight,height:d.height,goals:d.goals,answers:{...d}};
  const weak=[...SK].sort((x,y)=>b[x]-b[y]);
  // Pocos hábitos al principio (4): objetivos elegidos + puntos más débiles
  const focus=[...new Set([...d.goals,...weak])].slice(0,4);
  const habits=focus.map(k=>{
    const recs=RECS[k].good;
    // el hábito más accesible primero: el de menos XP para quien empieza, el principal para el resto
    const rec = easyFor(k,b,p) ? [...recs].sort((x,y)=>x.xp-y.xp)[0] : recs[0];
    return makeHabit(k,rec,'good',b,p);
  });
  const bads=[];
  if(d.fast>=2) bads.push(['nutricion',0]);
  if(d.phone>=3) bads.push(['intelecto',0]);
  if(d.sleep<=6) bads.push(['sueno',0]);
  if(d.money<=2) bads.push(['finanzas',0]);
  if(bads.length<2) bads.push(['mente',0]);
  bads.slice(0,2).forEach(([k,i])=>habits.push(makeHabit(k,RECS[k].bad[i],'bad')));
  S={
    v:2, profile:p, base:b, delta:{}, start:today(), lastProcessed:addDays(today(),-1), xp:0, best:0, habits, days:{},
    avatar:{skin:AV.skins[1],hair:d.sex==='m'?'largo':'corto',hairColor:AV.hairColors[1],shirt:AV.shirts[0],acc:'none'},
    seed:Math.floor(Math.random()*1e9), shields:1, sound:true, ach:{},
    stats:{good:0,chests:0,perfect:0,mini:0,lvlup:0,skills:{},redeemed:0,missions:0}
  };
  save(); tab='perfil'; render();
  setTimeout(()=>toast('Personaliza tu personaje 🎨 · Te regalamos 1 🛡️','gold'),300);
}

function habitCard(h,d){
  const on=d.done[h.id]!==undefined, isMini=on&&d.mini&&d.mini[h.id];
  const m=mult()*(S.curse?.5:1);
  const xp = on ? d.done[h.id] : (h.type==='good'?Math.max(1,Math.round(h.xp*m)):-h.xp);
  const canLvl = h.type==='good' && h.lvl==='easy' && (h.count||0)>=10;
  return `<div class="habit ${h.type} ${on?'done':''} ${isMini?'mini':''}">
    <div class="ic">${esc(h.icon||SKILLS[h.skill].e)}</div>
    <div class="grow"><div class="nm">${esc(h.name)}</div>
      <div class="small muted">${SKILLS[h.skill].e} ${SKILLS[h.skill].n}${h.type==='good'&&h.count?` · ${h.count}✓`:''}</div>
      ${h.type==='good'&&h.mini&&!on?`<div class="mini-txt">🌱 Mínimo: ${esc(h.mini)}</div>`:''}
      ${canLvl?`<button class="lvlup" onclick="levelUpHabit('${h.id}')">⬆️ Dominado: subir a «${esc(h.normal)}»</button>`:''}
    </div>
    <div class="xp">${xp>0?'+':''}${xp}</div>
    ${h.type==='good'&&!on?`<button class="minib" onclick="toggleHabit('${h.id}',true)" title="Versión mínima: media XP">🌱<br>½</button>`:''}
    <button class="check" onclick="toggleHabit('${h.id}')" aria-label="${on?'Desmarcar':'Marcar'} ${esc(h.name)}">${on?(h.type==='good'?(isMini?'🌱':'✓'):'✗'):''}</button>
    <button class="del" onclick="delHabit('${h.id}')" aria-label="Borrar">🗑️</button>
  </div>`;
}

  <div class="card">
    <div class="row between" style="margin-bottom:10px"><h2 style="margin:0">🏅 Logros</h2><span class="small muted">${nAch}/${ACH.length}</span></div>
    <div class="achs">${ACH.map(a=>`<div class="ach ${S.ach[a.id]?'got':'lock'}"><span class="ae">${a.e}</span><b>${a.n}</b><span class="muted">${a.d}</span><br><span style="color:var(--gold);font-weight:700">+${a.xp}</span></div>`).join('')}</div>
  </div>
  <div class="card">
    <h2>🏆 Rangos</h2>
    <div class="ladder">${RANKS.map((r,i)=>{const un=AV.accs.find(a=>a[2]===i&&i>0);return `<div class="lv ${i<=ri.i?'got':''} ${i===ri.i?'cur':''}" style="--c:${r.c}">
      <span class="em">${r.i}</span><div class="grow"><b>${r.n}</b>${i===ri.i?` <span class="small" style="color:${r.c}">· ${ri.div||'MAX'} · Estás aquí</span>`:''}<div class="small muted">${fmt(r.min)} XP${un?` · desbloquea ${un[1]}`:''}</div></div>
      ${i<=ri.i?'✅':'🔒'}</div>`}).join('')}</div>
    <p class="small muted" style="margin-top:10px">Cada rango tiene 3 divisiones (III → II → I). Los hábitos malos y la maldición pueden hacerte <b>bajar</b>.</p>
  </div>`;
}

function viewPerfil(){
  const a=S.avatar, ri=rankInfo(S.xp), best=Math.min(RANKS.length-1,Math.max(S.best||0,ri.i)), p=S.profile;
  const sw=(list,key)=>`<div class="opts">${list.map(c=>`<button class="sw ${a[key]===c?'on':''}" style="background:${c}" onclick="setAv('${key}','${c}')" aria-label="${c}"></button>`).join('')}</div>`;
  return `
  <div class="card" style="text-align:center">
    ${avatarSVG(a,ri.r.c,'avatar-big')}
    <h2 style="font-size:1.4rem;margin:6px 0 2px">${esc(p.name)}</h2>
    <div class="muted small">${charClass()} · Nivel ${['principiante','intermedio','avanzado'][fitTier()]} · <span style="color:${ri.r.c};font-weight:700">${ri.r.i} ${ri.r.n} ${ri.div}</span></div>
  </div>
  <div class="card">
    <h2>🎨 Personaliza tu personaje</h2>
    <label class="small muted">Piel</label>${sw(AV.skins,'skin')}
    <label class="small muted">Peinado</label>
    <div class="opts">${AV.hairs.map(([k,l])=>`<button class="opt ${a.hair===k?'on':''}" onclick="setAv('hair','${k}')">${l}</button>`).join('')}</div>
    <label class="small muted">Color de pelo</label>${sw(AV.hairColors,'hairColor')}
    <label class="small muted">Ropa</label>${sw(AV.shirts,'shirt')}
    <label class="small muted">Accesorio (se desbloquean subiendo de rango)</label>
    <div class="opts">${AV.accs.map(([k,l,r])=>{const lock=r>best;return `<button class="opt ${a.acc===k?'on':''} ${lock?'locked':''}" onclick="${lock?`toast('🔒 Se desbloquea en ${RANKS[r].n}','bad')`:`setAv('acc','${k}')`}">${lock?'🔒 ':''}${l}</button>`}).join('')}</div>
    <p class="small muted">El aura de tu personaje toma el color de tu rango.</p>
  </div>
  <div class="card">
    <h2>📊 Tus datos</h2>
    <div class="small muted" style="line-height:1.8">
      Edad: <b>${p.age||'—'}</b> · Peso: <b>${p.weight||'—'} kg</b> · Altura: <b>${p.height||'—'} cm</b>
      ${p.weight&&p.height?` · IMC: <b>${bmiOf(p).toFixed(1)}</b>`:''}<br>
      Reto iniciado: <b>${parseKey(S.start).toLocaleDateString('es-ES')}</b> · Mejor rango: <b>${RANKS[best].n}</b><br>
      Hábitos completados: <b>${S.stats.good}</b> · Días perfectos: <b>${S.stats.perfect}</b> · Maldiciones superadas: <b>${S.stats.redeemed}</b>
    </div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
      <button class="btn ghost sm" onclick="updWeight()">⚖️ Actualizar peso</button>
      <button class="btn ghost sm" onclick="S.sound=!S.sound;save();render();sfx('good')">${S.sound?'🔊 Sonido sí':'🔇 Sonido no'}</button>
      <button class="btn danger sm" onclick="resetAll()">↺ Reiniciar</button>
    </div>
  </div>
  ${saveCard()}`;
}

function saveCard(){
  const last=S.lastBackup?new Date(S.lastBackup).toLocaleDateString('es-ES'):null;
  const old=!S.lastBackup || (Date.now()-S.lastBackup)>7*864e5;
  return `<div class="card" id="guardar">
    <h2>💾 Guardar mi progreso</h2>
    <p class="small muted" style="margin-bottom:10px">Tu progreso se guarda <b>automáticamente</b> en este dispositivo cada vez que marcas algo.
    Haz una copia de seguridad para no perderlo si cambias de móvil o borras el navegador.</p>
    <p class="small" style="margin-bottom:12px;color:${old?'var(--gold)':'var(--good)'}">${last?`Última copia: <b>${last}</b>`:'Aún no has hecho ninguna copia'}${old?' · ¡Haz una ahora!':' ✓'}</p>
    <div class="two">
      <button class="btn sm" onclick="exportData()">⬇️ Descargar copia</button>
      <button class="btn ghost sm" onclick="document.getElementById('imp').click()">📂 Restaurar archivo</button>
      <button class="btn ghost sm" onclick="copyCode()">📋 Copiar código</button>
      <button class="btn ghost sm" onclick="pasteCode()">🔑 Pegar código</button>
    </div>
    <input id="imp" type="file" accept="application/json,.json" class="hidden" onchange="importData(this)">
    <p class="small muted" style="margin-top:10px">El <b>código de guardado</b> es un texto con toda tu partida: pégalo en tus notas o envíatelo por WhatsApp/email y úsalo en otro móvil con «Pegar código».</p>
  </div>
  <div class="card">
    <h2>📲 Instalar como app</h2>
    ${isStandalone()?'<p class="small" style="color:var(--good)">✓ Ya estás usando la app instalada.</p>':`
    <p class="small muted" style="margin-bottom:10px">Instálala para abrirla desde un icono en tu pantalla de inicio, a pantalla completa y sin conexión.</p>
    ${installEvt?'<button class="btn block" onclick="installApp()">📲 Instalar 66 Days</button>':`
    <div class="small" style="line-height:1.7">
      <b>iPhone (Safari):</b> pulsa <b>Compartir</b> ⬆️ → <b>Añadir a pantalla de inicio</b>.<br>
      <b>Android (Chrome):</b> menú <b>⋮</b> → <b>Instalar aplicación</b> (o «Añadir a pantalla de inicio»).
    </div>`}`}
  </div>`;
}

function render(){
  if(!S){ renderOnboarding(); return }
  document.body.classList.toggle('cursed',!!S.curse);
  const v={hoy:viewHoy,stats:viewStats,rank:viewRank,perfil:viewPerfil}[tab]();
  document.getElementById('app').innerHTML = header()+`<main class="wrap">${v}</main>`+navbar();
  if(tab==='stats') drawStatsRadar();
  flush();
}
function drawStatsRadar(){
  const now={}, init={}; SK.forEach(k=>{now[k]=skillVal(k);init[k]=clamp(S.base[k],0,100)});
  requestAnimationFrame(()=>drawRadar(document.getElementById('radar'),now,init));
}

/* ---------------- Acciones ---------------- */
function setAv(k,v){ S.avatar[k]=v; save(); render() }
function delHabit(id){
  const h=S.habits.find(x=>x.id===id); if(!h) return;
  if(!confirm(`¿Borrar "${h.name}"?`)) return;
  const d=getDay();
  if(d.done[id]!==undefined){ addXp(-d.done[id],'undo'); delete d.done[id]; if(d.mini) delete d.mini[id] }
  S.habits=S.habits.filter(x=>x.id!==id);
  d.g=goods().length;
  const st=dayStatus(today());
  if(st.cls!=='perfect' && d.bonus){ addXp(-d.bonus,'undo'); d.bonus=0; S.stats.perfect-- }
  evalMissions(); save(); render();
}
function addRec(skill,type,i){
  const r=RECS[skill][type][i]; if(!r) return;
  S.habits.push(makeHabit(skill,r,type,S.base,S.profile)); save(); render();
  toast(type==='good'?'Hábito añadido a "Hoy" ✅':'Ahora vigilas este hábito ⚠️', type==='good'?'good':'bad');
}
function habitForm(type){
  openModal(`<h2>${type==='good'?'✅ Nuevo hábito':'⚠️ Nuevo hábito malo'}</h2>
  <div class="field"><label>Nombre</label><input type="text" id="hfN" maxlength="40" placeholder="${type==='good'?'Ej: Entrenar piernas':'Ej: Fumar'}"></div>
  ${type==='good'?'<div class="field"><label>Versión mínima (para días difíciles)</label><input type="text" id="hfM" maxlength="40" placeholder="Ej: 10 sentadillas"></div>':''}
  <div class="two">
    <div class="field"><label>Habilidad</label><select id="hfS">${SK.map(k=>`<option value="${k}">${SKILLS[k].e} ${SKILLS[k].n}</option>`).join('')}</select></div>
    <div class="field"><label>${type==='good'?'XP que da':'XP que quita'}</label><select id="hfX">${[5,10,15,20,25,30].map(x=>`<option ${x===15?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>
  <div class="field"><label>Emoji (opcional)</label><input type="text" id="hfI" maxlength="4" placeholder="🔥"></div>
  <div class="row"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn grow" onclick="saveHabit('${type}')">Guardar</button></div>`);
  setTimeout(()=>document.getElementById('hfN').focus(),50);
}
function saveHabit(type){
  const n=document.getElementById('hfN').value.trim(); if(!n){toast('Ponle un nombre','bad');return}
  const mEl=document.getElementById('hfM');
  S.habits.push({id:uid(),name:n,type,skill:document.getElementById('hfS').value,xp:+document.getElementById('hfX').value,icon:document.getElementById('hfI').value.trim(),mini:type==='good'?(mEl.value.trim()||'Versión mínima (2 min)'):undefined,count:0});
  save(); closeModal(); render();
}
function updWeight(){
  const w=prompt('Tu peso actual (kg):',S.profile.weight||''); if(w===null) return;
  const n=parseFloat(String(w).replace(',','.')); if(!(n>30&&n<300)){toast('Peso no válido','bad');return}
  (S.profile.weights=S.profile.weights||[]).push({d:today(),w:n}); S.profile.weight=n; save(); render(); toast('Peso actualizado','good');
}
function exportData(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='66-days-'+today()+'.json'; a.click();
  markBackup(); toast('Copia descargada ✅','good');
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  f.text().then(t=>{ try{ restore(JSON.parse(t)) }catch(e){ toast('Archivo no válido','bad') } });
  inp.value='';
}
function resetAll(){
  if(!confirm('¿Seguro? Se borrará todo tu progreso y empezarás de cero.')) return;
  try{localStorage.removeItem(KEY)}catch(e){} S=null; ob.step=0; render();
}

/* ---------------- Guardado / app instalable ---------------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(S&&tab==='perfil') render() });
window.addEventListener('appinstalled',()=>{ installEvt=null; toast('¡App instalada! 📲','gold'); if(S) render() });
function isStandalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true }
function installApp(){ if(!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render() }) }
function markBackup(){ S.lastBackup=Date.now(); save(); render() }
function encodeSave(){ return 'D66:'+btoa(unescape(encodeURIComponent(JSON.stringify(S)))) }
function decodeSave(t){ t=t.trim().replace(/^D66:/,''); return JSON.parse(decodeURIComponent(escape(atob(t)))) }
function copyCode(){
  S.lastBackup=Date.now(); save();
  const code=encodeSave();
  const done=()=>{ toast('Código copiado ✅ Guárdalo en tus notas','good'); render() };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(code).then(done,()=>showCode(code));
  else showCode(code);
}
function showCode(code){
  openModal(`<h2>📋 Tu código de guardado</h2><p class="small muted" style="margin-bottom:8px">Mantén pulsado para copiarlo todo.</p>
  <textarea readonly style="width:100%;height:160px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:.7rem" onclick="this.select()">${code}</textarea>
  <button class="btn block" style="margin-top:10px" onclick="closeModal();render()">Hecho</button>`);
}
function pasteCode(){
  openModal(`<h2>🔑 Restaurar con código</h2><p class="small muted" style="margin-bottom:8px">Pega aquí tu código de guardado. <b>Se reemplazará la partida actual.</b></p>
  <textarea id="codeIn" placeholder="D66:..." style="width:100%;height:140px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:.75rem"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn grow" onclick="applyCode()">Restaurar</button></div>`);
}
function applyCode(){
  try{ const s=decodeSave(document.getElementById('codeIn').value); restore(s); closeModal() }
  catch(e){ toast('Código no válido','bad') }
}
function restore(s){
  if(!s||!s.habits||!s.base||!s.start) throw new Error('bad');
  S=s; migrate(); save(); tab='hoy'; render(); toast('Partida restaurada ✅','good');
}
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}) }
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* Al volver a la app (p. ej. al día siguiente) se procesan los días y se refresca */
let lastSeenDay=today();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && S){ processDays(); if(today()!==lastSeenDay){ lastSeenDay=today(); tab='hoy' } render() }
});
let rz;
window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(S&&tab==='stats') drawStatsRadar() },150) });

migrate();
processDays();
render();
</script>
</body>
</html>
